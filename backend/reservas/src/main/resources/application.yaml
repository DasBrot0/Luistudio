spring:
  application:
    name: reservas
  datasource:
    url: ${DB_URL:jdbc:h2:mem:luistudio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: America/Lima
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

security:
  password:
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
  jwt:
    secret: ${JWT_SECRET:luistudio-dev-secret-change-me}
    expiration-minutes: ${JWT_EXP_MINUTES:180}
    provisional-expiration-minutes: ${JWT_PROVISIONAL_EXP_MINUTES:10}

app:
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:luistudio_session}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  frontend:
    reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/restablecer-contrasena}
    confirm-change-url: ${FRONTEND_CONFIRM_CHANGE_URL:http://localhost:5173/confirmar-cambio}
  email:
    provider: ${EMAIL_PROVIDER:log}
    from: ${EMAIL_FROM:Luistudio <onboarding@resend.dev>}
    resend:
      api-key: ${RESEND_API_KEY:}
    gmail:
      client-id: ${GMAIL_CLIENT_ID:}
      client-secret: ${GMAIL_CLIENT_SECRET:}
      refresh-token: ${GMAIL_REFRESH_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.luistudio.reservas: ${APP_LOG_LEVEL:DEBUG}
